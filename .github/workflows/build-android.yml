name: Build Android

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Android build mode
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
  push:
    branches:
      - main
      - "major/**"
      - "feature/**"
      - "hotfix/**"
    paths-ignore:
      - "**/*.md"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Keep the certificate registered in Firebase stable across hosted runners.
      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_DEBUG_KEYSTORE_BASE64; refusing to generate an unregistered signing key."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          SHA1=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | sed -n 's/.*SHA1: //p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ "$SHA1" != "b26aba0a05ee978fe7ddeb9adafd7e6435cb7b40" ]; then
            echo "::error::Android signing certificate does not match the key registered in Firebase."
            exit 1
          fi
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Read build settings
        id: app
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE=release
          fi
          if [ -z "$VERSION" ]; then
            echo "Unable to read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: flutter build apk --${{ steps.app.outputs.mode }}

      - name: Rename APK
        shell: bash
        run: |
          SOURCE="build/app/outputs/flutter-apk/app-${{ steps.app.outputs.mode }}.apk"
          TARGET="build/app/outputs/flutter-apk/monthly-flow-${{ steps.app.outputs.mode }}-${{ steps.app.outputs.version }}.apk"
          if [ ! -f "$SOURCE" ]; then
            echo "APK not found: $SOURCE"
            exit 1
          fi
          cp "$SOURCE" "$TARGET"

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          CERTS=$("$APKSIGNER" verify --print-certs "build/app/outputs/flutter-apk/monthly-flow-${{ steps.app.outputs.mode }}-${{ steps.app.outputs.version }}.apk")
          printf '%s\n' "$CERTS"
          SHA1=$(printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p')
          if [ "$SHA1" != "b26aba0a05ee978fe7ddeb9adafd7e6435cb7b40" ]; then
            echo "::error::APK signing certificate is not registered in Firebase."
            exit 1
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: monthly-flow-android-${{ steps.app.outputs.mode }}-${{ steps.app.outputs.version }}
          path: build/app/outputs/flutter-apk/monthly-flow-${{ steps.app.outputs.mode }}-${{ steps.app.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 14
